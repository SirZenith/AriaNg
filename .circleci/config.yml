version: 2.1

jobs:
  build-web:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-web-{{ checksum "package-lock.json" }}
            - v1-web-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: v1-web-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - run:
          name: Typecheck
          command: npm run typecheck
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Unit tests
          command: npm run test
      - run:
          name: Build
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist
      - store_artifacts:
          path: dist
          destination: web

  build-legacy:
    docker:
      - image: cimg/node:14.17
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-legacy-{{ checksum "legacy/package-lock.json" }}
            - v1-legacy-
      - run:
          name: Install legacy dependencies
          command: cd legacy && npm install
      - save_cache:
          key: v1-legacy-{{ checksum "legacy/package-lock.json" }}
          paths:
            - legacy/node_modules
      - run:
          name: Build legacy version
          command: cd legacy && npm run build
      - store_artifacts:
          path: legacy/dist
          destination: legacy

  publish_daily_build:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Publish daily build
          command: bash ./scripts/publish_dailybuild.sh

workflows:
  version: 2
  build_and_publish:
    jobs:
      - build-web
      - build-legacy
      - publish_daily_build:
          requires:
            - build-web
          filters:
            branches:
              only: master
